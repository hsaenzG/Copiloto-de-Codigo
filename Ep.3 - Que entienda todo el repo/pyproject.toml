[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-copilot-agent"
version = "0.1.0"
description = "AI code copilot agent that ingests, evaluates, explains, scans and recommends improvements for a repository."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "strands-agents>=0.1.0",
    "strands-agents-tools>=0.1.0",
    "requests>=2.31.0",
    "botocore[crt]>=1.34.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    # Episode 3: RAG (retrieval only). LangChain is used exclusively as the
    # retrieval layer; the single orchestration layer is Strands.
    "langchain-aws>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "faiss-cpu>=1.8.0",
    # Episode 3: HTTP service + native-SDK memory backend on Supabase.
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "supabase>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
# Optional scanners. scan_sast uses the Semgrep CLI when available and falls
# back to built-in heuristics otherwise.
scanners = [
    "semgrep>=1.100.0",
]

[project.scripts]
code-copilot = "code_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
